<!-- 보유종목의 KIS 일봉과 기술지표를 표시하는 비공개 분석 페이지다. -->
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="보유종목 기술 분석">
  <title>포트폴리오 분석</title>
  <link rel="stylesheet" href="styles.css?v=20260822-7">
</head>
<body>
  <header>
    <a id="mark" href="index.html" aria-label="포트폴리오 메인으로"><img src="assets/portfolio-mark.png" alt=""></a>
    <div><p class="eyebrow">PORTFOLIO / ANALYSIS</p><h1>종목 분석</h1></div>
    <nav class="header-nav" aria-label="페이지 이동"><a class="settings-link" href="index.html">메인</a><a class="settings-link" href="settings.html">설정</a></nav>
  </header>
  <main class="analysis-main">
    <section class="analysis-controls" aria-labelledby="analysis-title">
      <div><p class="eyebrow">HOLDING ANALYSIS</p><h2 id="analysis-title">보유 종목</h2><p class="hint">평균매수가와 현재가, 20·60·120일 이동평균선, 거래량, RSI(14)를 표시합니다. 전체 기간은 좌우로 스크롤합니다.</p></div>
      <div id="analysis-holdings" class="analysis-holdings" aria-live="polite"></div>
    </section>
    <section class="analysis-chart" aria-label="보유종목 기술 분석"><div class="analysis-chart-shell"><div id="analysis-chart-host" aria-live="polite"></div><div id="analysis-chart-legend" aria-label="이동평균선 범례"></div><div id="analysis-chart-prices" aria-label="현재가와 평균매수가"></div><div id="analysis-chart-axis" aria-label="가격 축"></div></div><div id="analysis-units" class="analysis-ranges" aria-label="차트 단위"></div><div id="analysis-ranges" class="analysis-ranges" aria-label="차트 기간"></div></section>
  </main>
  <script type="module" src="analysis.mjs?v=20260822-16"></script>
</body>
</html>
